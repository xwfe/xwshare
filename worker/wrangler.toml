name = "xwshare-worker"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "xwshare-db"
database_id = "your-d1-database-id"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "xwshare-files"

[triggers]
crons = ["*/15 * * * *"]

[vars]
# PICKUP_CODE_SECRET = "change_me"
# TURNSTILE_SECRET_KEY = "change_me"

# 本地请用 `pnpm dev`（脚本带 --var ENVIRONMENT:development）。
# 不要把 ENVIRONMENT=development 写进顶层 [vars]，部署生产时会一起带上，Turnstile 就被跳过。
[env.development.vars]
ENVIRONMENT = "development"
