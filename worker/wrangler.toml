name = "xshare-worker"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "drop-db"
database_id = "your-d1-database-id"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "drop-files"

[triggers]
crons = ["*/15 * * * *"]

[vars]
# PICKUP_CODE_SECRET = "change_me"
# TURNSTILE_SECRET_KEY = "change_me"

# 开发环境覆盖（wrangler dev 时自动应用）
[env.development.vars]
ENVIRONMENT = "development"
